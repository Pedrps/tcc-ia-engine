name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes e Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt || echo "Sem requirements ainda"

      - name: Verificar estrutura
        run: |
          echo "✅ Código recebido"
          ls -la
          echo "✅ Estrutura verificada"

      - name: Testar se app inicia (quando existir)
        run: |
          if [ -f "src/main.py" ]; then
            echo "✅ App encontrado"
          else
            echo "⏳ App ainda não criado"
          fi
